[www]
; Enable access log
access.log = /proc/self/fd/2
; Detailed access log format showing full request information
; %R - remote IP address
; %u - remote user
; %t - server time the request was received
; %m - request method
; %r - request URI (this is what was missing!)
; %Q - query string
; %q - query string prepended with ? or empty
; %s - status code
; %f - script filename
; %{mili}d - time taken to serve the request in milliseconds
; %{kilo}M - peak memory usage in kilobytes
; %C - CPU percentage used
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"